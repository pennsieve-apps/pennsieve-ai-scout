[project]
name = "pennsieve-ai-scout"
version = "0.0.1"
description = "Pennsieve compute-node processor — stage 1 of the pennsieve-ai research pipeline."
requires-python = ">=3.12"
dependencies = [
    # pennsieve-llm SDK is a thin configuration helper over the official
    # `anthropic` SDK — `Governor().client()` returns a pre-configured
    # `anthropic.Anthropic` pointed at the governor with SigV4 auth and the
    # x-execution-run-id header wired up. Pulls in anthropic, httpx, and
    # boto3 transitively.
    "pennsieve-llm>=0.4.4",
    "numpy>=1.26",
    "json-repair>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
