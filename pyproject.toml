[project]
name = "pennsieve-ai-scout"
version = "0.0.1"
description = "Pennsieve compute-node processor — stage 1 of the pennsieve-ai research pipeline."
requires-python = ">=3.12"
dependencies = [
    # pennsieve-llm SDK handles SigV4-signed HTTPS calls to the Pennsieve
    # LLM Governor, plus AnthropicBackend for local dev. Pulls in anthropic,
    # httpx, and boto3 transitively.
    "pennsieve-llm>=0.3.0",
    "numpy>=1.26",
    "json-repair>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
